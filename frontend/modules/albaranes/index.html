<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPK NEXUS - Albaranes</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-dark: #0f0f0f;
            --panel-bg: #1a1a1a;
            --panel-border: #333333;
            --rpk-red: #E30613;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-green: #22c55e;
            --glass-bg: rgba(26, 26, 26, 0.7);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .neo-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .neo-panel:hover {
            border-color: rgba(227, 6, 19, 0.3);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        h1,
        h2,
        h3 {
            font-weight: 600;
            margin: 0;
        }

        .text-gradient {
            background: linear-gradient(90deg, #fff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title {
            font-size: 1.5rem;
            letter-spacing: -0.02em;
        }

        .kpi-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 8px 0;
            color: white;
            text-shadow: 0 2px 10px rgba(227, 6, 19, 0.2);
        }

        .kpi-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Nav & Layout */
        nav {
            border-bottom: 1px solid var(--panel-border);
            background: rgba(15, 15, 15, 0.9);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th {
            text-align: left;
            padding: 12px 16px;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--panel-border);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Inputs & Buttons */
        .rpk-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }

        .rpk-input:focus {
            border-color: var(--rpk-red);
            box-shadow: 0 0 0 2px rgba(227, 6, 19, 0.2);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--rpk-red);
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--rpk-red);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            background: rgba(34, 197, 94, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .status-badge.warning {
            background: rgba(234, 179, 8, 0.1);
            color: #eab308;
            border-color: rgba(234, 179, 8, 0.2);
        }

        .btn-rpk {
            background: var(--rpk-red);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn-rpk:hover {
            background: #ff1a2b;
            box-shadow: 0 0 15px rgba(227, 6, 19, 0.4);
        }
    </style>
</head>

<body>

    <nav class="flex items-center justify-between px-6 py-4">
        <div class="flex items-center gap-4">
            <a href="/portal/" class="text-white hover:text-gray-300 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
            </a>
            <h1 class="header-title text-gradient">NEXUS Albaranes</h1>
        </div>
        <div class="flex items-center gap-6">
            <div id="status-indicator" class="status-badge flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-green-500 indicator-dot"></div>
                <span id="status-text">Analítica Conectada</span>
            </div>
            <div class="flex items-center gap-3 bg-black/30 p-2 rounded-xl border border-gray-800">
                <input type="date" id="date-start" class="rpk-input border-none bg-transparent">
                <span class="text-gray-500">hasta</span>
                <input type="date" id="date-end" class="rpk-input border-none bg-transparent">
                <button onclick="clearFilter()" title="Limpiar filtro"
                    class="text-gray-500 hover:text-white transition-colors p-1"
                    style="background:none; border:none; cursor:pointer;">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="container grid grid-cols-1 lg:grid-cols-4 gap-6">

        <!-- Left Column: KPIs & Clientes -->
        <div class="lg:col-span-1 flex flex-col gap-6">
            <div class="neo-panel">
                <div class="kpi-label">Valor Total Albaranado</div>
                <div class="kpi-value" id="kpi-valor">€0</div>
                <div class="text-sm text-gray-400 mt-2" id="kpi-dates">Período seleccionado</div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="neo-panel text-center p-4">
                    <div class="kpi-label" style="font-size:0.7rem">Cantidades</div>
                    <div class="text-2xl font-bold text-white mt-2" id="kpi-items">0</div>
                </div>
                <div class="neo-panel text-center p-4">
                    <div class="kpi-label" style="font-size:0.7rem">Clientes</div>
                    <div class="text-2xl font-bold text-white mt-2" id="kpi-clientes">0</div>
                </div>
            </div>

            <div class="neo-panel flex-grow flex flex-col" style="max-height: 500px">
                <h3 class="text-lg mb-4 text-gradient">Top Clientes</h3>
                <div class="overflow-y-auto flex-grow pr-2" id="ranking-container">
                    <div class="flex justify-center py-8" id="ranking-loader">
                        <div class="loader"></div>
                    </div>
                    <div id="ranking-list" class="flex flex-col gap-3"></div>
                </div>
            </div>
        </div>

        <!-- Right Column: Charts & Details -->
        <div class="lg:col-span-3 flex flex-col gap-6">

            <div class="neo-panel" style="height: 350px;">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg text-gradient">Evolución de Entregas (Eur)</h3>
                </div>
                <div class="relative w-full h-[250px]">
                    <canvas id="evolutionChart"></canvas>
                </div>
            </div>

            <div class="neo-panel flex-grow">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg text-gradient">Artículos Expedidos</h3>
                    <input type="text" id="search-items" placeholder="Buscar Artículo..." class="rpk-input w-64"
                        oninput="filterItems()">
                </div>
                <div class="overflow-x-auto">
                    <table>
                        <thead>
                            <tr>
                                <th>Artículo</th>
                                <th style="text-align: right">Cant. Entregada</th>
                                <th style="text-align: right">Importe Total</th>
                                <th>Peso Específico</th>
                            </tr>
                        </thead>
                        <tbody id="items-body">
                            <tr>
                                <td colspan="4" class="text-center py-8 text-gray-500">
                                    <div class="loader inline-block"></div> Buscando...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        let evolutionChart = null;
        let itemsData = [];
        let globalValorTotal = 0;

        async function init() {
            const res = await fetch('/api/fechas');
            const data = await res.json();

            if (data.warning) showWarning();

            document.getElementById('date-start').value = data.fecha_min || '';
            document.getElementById('date-end').value = data.fecha_max || '';

            document.getElementById('date-start').addEventListener('change', loadAll);
            document.getElementById('date-end').addEventListener('change', loadAll);

            loadAll();
        }

        function clearFilter() {
            document.getElementById('date-start').value = '';
            document.getElementById('date-end').value = '';
            loadAll();
        }

        function showWarning() {
            const badge = document.getElementById('status-indicator');
            const text = document.getElementById('status-text');
            badge.className = 'status-badge warning flex items-center gap-2';
            text.innerText = 'Info Histórica Desactualizada';
            badge.querySelector('.indicator-dot').className = 'w-2 h-2 rounded-full bg-yellow-500 indicator-dot';
        }

        async function loadAll() {
            const start = document.getElementById('date-start').value;
            const end = document.getElementById('date-end').value;
            if (start || end) {
                document.getElementById('kpi-dates').innerText = `${start || '...'} a ${end || '...'}`;
            } else {
                document.getElementById('kpi-dates').innerText = `Todo el histórico`;
            }

            await Promise.all([
                fetchSummary(start, end),
                fetchClientes(start, end),
                fetchItems(start, end)
            ]);
        }

        async function fetchSummary(start, end) {
            try {
                const res = await fetch(`/api/albaranes/resumen?fecha_inicio=${start}&fecha_fin=${end}`);
                const data = await res.json();

                if (data.warning) showWarning();

                const val = data.kpis.valor_total || 0;
                globalValorTotal = val;
                document.getElementById('kpi-valor').innerText = '€' + val.toLocaleString('es-ES', { maximumFractionDigits: 0 });
                document.getElementById('kpi-items').innerText = (data.kpis.num_items || 0).toLocaleString('es-ES');
                document.getElementById('kpi-clientes').innerText = (data.kpis.num_clientes || 0).toLocaleString('es-ES');

                renderChart(data.evolucion);
            } catch (e) { console.error("Error fetching summary", e); }
        }

        async function fetchClientes(start, end) {
            try {
                document.getElementById('ranking-loader').style.display = 'flex';
                document.getElementById('ranking-list').innerHTML = '';

                const res = await fetch(`/api/albaranes/clientes?fecha_inicio=${start}&fecha_fin=${end}`);
                const data = await res.json();

                document.getElementById('ranking-loader').style.display = 'none';
                const list = document.getElementById('ranking-list');

                const total = data.reduce((sum, item) => sum + item.Valor_Total, 0);

                data.forEach((c, i) => {
                    const p = total > 0 ? (c.Valor_Total / total) * 100 : 0;
                    const el = document.createElement('div');
                    el.innerHTML = `
                    <div class="flex justify-between text-sm mb-1">
                        <span class="font-medium truncate pr-2">#${i + 1} ${c.Cliente}</span>
                        <span class="text-gray-400">€${(c.Valor_Total / 1000).toFixed(1)}k</span>
                    </div>
                    <div class="w-full h-1.5 bg-gray-800 rounded-full overflow-hidden">
                        <div class="h-full bg-red-600" style="width: ${p}%"></div>
                    </div>
                `;
                    list.appendChild(el);
                });
            } catch (e) { console.error("Error fetching clients", e); }
        }

        async function fetchItems(start, end) {
            try {
                const res = await fetch(`/api/albaranes/articulos?fecha_inicio=${start}&fecha_fin=${end}`);
                itemsData = await res.json();
                renderItemsTable();
            } catch (e) { console.error("Error fetching items", e); }
        }

        function renderItemsTable() {
            const body = document.getElementById('items-body');
            body.innerHTML = '';

            if (itemsData.length === 0) {
                body.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-gray-500">No hay expidiciones</td></tr>';
                return;
            }

            const query = document.getElementById('search-items').value.toLowerCase();

            itemsData.forEach(item => {
                if (query && !item.Articulo.toLowerCase().includes(query)) return;

                const p = globalValorTotal > 0 ? (item.Valor_Total / globalValorTotal) * 100 : 0;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                <td class="font-semibold text-red-500">${item.Articulo}</td>
                <td style="text-align: right">${(item.Cantidad || 0).toLocaleString()}</td>
                <td style="text-align: right; font-weight: 600">€${(item.Valor_Total || 0).toLocaleString('es-ES', { minimumFractionDigits: 2 })}</td>
                <td>
                    <div class="flex items-center gap-2">
                        <div class="w-full h-1.5 bg-gray-800 rounded-full overflow-hidden">
                            <div class="h-full bg-red-600" style="width: ${p}%"></div>
                        </div>
                        <span class="text-xs text-gray-400 w-8 text-right">${p.toFixed(1)}%</span>
                    </div>
                </td>
            `;
                body.appendChild(tr);
            });
        }

        function filterItems() {
            renderItemsTable();
        }

        function renderChart(data) {
            const ctx = document.getElementById('evolutionChart').getContext('2d');
            if (evolutionChart) evolutionChart.destroy();

            if (!data || data.length === 0) return;

            const labels = data.map(d => {
                const date = new Date(d.Fecha);
                return date.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
            });
            const values = data.map(d => d.Valor_Total);

            evolutionChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Importe Expedido (€)',
                        data: values,
                        borderColor: '#E30613',
                        backgroundColor: 'rgba(227,6,19,0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 3,
                        pointRadius: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(0,0,0,0.8)',
                            titleColor: '#fff',
                            bodyColor: '#fff',
                            borderColor: '#E30613',
                            borderWidth: 1,
                            callbacks: {
                                label: function (ctx) {
                                    return '€' + ctx.raw.toLocaleString('es-ES', { maximumFractionDigits: 0 });
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#9ca3af' }
                        },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: {
                                color: '#9ca3af',
                                callback: function (val) { return '€' + (val / 1000).toFixed(0) + 'k'; }
                            }
                        }
                    },
                    interaction: { mode: 'nearest', axis: 'x', intersect: false }
                }
            });
        }

        // Auto-init
        init();
    </script>

</body>

</html>
